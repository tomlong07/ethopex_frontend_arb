name: Deploy Frontend ARB Strict V2

on:
  push:
    branches:
      - main

jobs:
  # ======================
  # TYPE CHECK
  # ======================
  type-check:
    name: Type Check
    if: ${{ contains(github.event.head_commit.message, '--fe') }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"

    steps:
      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        with:
          node-version: "20.x"
          cache: yarn
          cache-dependency-path: sf-dashboard/yarn.lock

      - name: Cache node_modules
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        uses: actions/cache@v4
        with:
          path: sf-dashboard/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('sf-dashboard/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ !contains(github.event.head_commit.message, '--fast') && steps.cache-modules.outputs.cache-hit != 'true' }}
        working-directory: sf-dashboard
        run: yarn install --frozen-lockfile --prefer-offline

      - name: VueTSC Checker
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        working-directory: sf-dashboard
        run: npx vue-tsc --noEmit
  # ======================
  # oxlint
  # ======================
  oxlint:
    if: ${{ contains(github.event.head_commit.message, '--fe') }}

    name: OXLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}

        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: yarn
          cache-dependency-path: sf-dashboard/yarn.lock

      - name: Install dependencies
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        working-directory: sf-dashboard
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Run oxlint
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        working-directory: sf-dashboard
        run: |
          npx oxlint .

  # ======================
  # CHECK LANGUAGE
  # ======================
  check-lang:
    if: ${{ contains(github.event.head_commit.message, '--fe') }}
    name: Check Language
    runs-on: ubuntu-latest

    steps:
      - name: Skip entire job if --fast flag is present
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}

        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"--fast"* ]]; then
            echo "⚡ Detected --fast flag in commit message"
            echo "Skipping Check Language entirely"
            exit 0
          else
            echo "No --fast flag → proceeding with full Check Language"
          fi
      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
      - uses: actions/setup-node@v4
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        with:
          node-version: "20.x"
          cache: yarn
          cache-dependency-path: sf-dashboard/yarn.lock

      - name: Install deps
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        working-directory: sf-dashboard
        run: yarn install --frozen-lockfile

      - name: Check lang
        if: ${{ !contains(github.event.head_commit.message, '--fast') }}
        working-directory: sf-dashboard
        run: yarn check-lang

  # ======================
  # BUILD
  # ======================
  build:
    if: ${{ contains(github.event.head_commit.message, '--fe')}}
    name: Build Vue (artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: yarn
          cache-dependency-path: sf-dashboard/yarn.lock

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: sf-dashboard/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('sf-dashboard/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        working-directory: sf-dashboard
        run: yarn install --frozen-lockfile --prefer-offline --network-concurrency 8

      - name: Build Vue
        working-directory: sf-dashboard
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
          ROLLUP_PARALLEL: "true"
        run: |
          echo "VITE_END_POINT=${{ secrets.VITE_ENDPOINT_PRODUCTION }}" >> .env.production
          yarn build --mode production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sf-dashboard/dist

  # ======================
  # DEPLOY
  # ======================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs:
      - type-check
      - oxlint
      - check-lang
      - build
    steps:
      # 1. Checkout code (cần nếu muốn logs / artifact)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Download artifact build từ job build
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: sf-dashboard/dist

      # 3. Check artifact exists
      - name: Check artifact exists
        run: |
          if [ ! -d "sf-dashboard/dist" ]; then
            echo "No build artifact, skipping deploy"
            exit 0
          fi

      # 4. Setup SSH
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Add Known Hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 5. Copy build to server
      - name: Copy dist to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: sf-dashboard/dist
          target: /home/aff/go/PP-AFF/sf-dashboard/dist
          strip_components: 2

      # 6. Post-deploy command
      - name: Post deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: aff
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/aff/go/PP-AFF/sf-dashboard/dist
            echo '{ "version": "${{ github.run_id }}" }' > version.json

  # ======================
  # NOTIFY
  # ======================
  notify-telegram:
    name: Notify Telegram
    needs:
      - type-check
      - oxlint
      - check-lang
      - build
      - deploy
    runs-on: ubuntu-latest
    if: ${{ always() && contains(github.event.head_commit.message, '--fe') && !contains(github.event.head_commit.message, '--silent') }}

    steps:
      - name: Prepare message vars
        id: vars
        run: |
          # ENV label
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "env_label=🟢🟢🟢 PRODUCTION" >> $GITHUB_OUTPUT
          else
            echo "env_label=🧑‍💻🧑‍💻🧑‍💻 DEV" >> $GITHUB_OUTPUT
          fi

          # Collect job results
          results=(
            "${{ needs.type-check.result }}"
            "${{ needs.oxlint.result }}"
            "${{ needs.check-lang.result }}"
            "${{ needs.build.result }}"
            "${{ needs.deploy.result }}"
          )

          overall="success"

          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              overall="failure"
              break
            fi
          done

          if [[ "$overall" == "success" ]]; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "status_icon=✅✅✅" >> $GITHUB_OUTPUT
          else
            echo "status=FAILURE" >> $GITHUB_OUTPUT
            echo "status_icon=❌❌❌" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.CHATID_TELEGRAM_ARBDEV }}
          token: ${{ secrets.BOTID_TELEGRAM_PUBPOWER }}
          message: |
            ${{ steps.vars.outputs.status_icon }} [${{ steps.vars.outputs.status }}] — ${{ steps.vars.outputs.env_label }}
            🔧 Workflow: ${{ github.workflow }}
            📦 Repository: ${{ github.repository }}
            👤 Triggered by: ${{ github.actor }}
            📝 Commit: "${{ github.event.head_commit.message }}"
            🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
